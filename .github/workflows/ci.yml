name: Run Fantasy Bot

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  # ============================================================
  # LIGA 1: HUGO LEAGUE 1 (017817326) - con reportes a Telegram
  # ============================================================
  run-bot-liga1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install .

      - name: Create tokens.json from Secret
        env:
          FANTASY_AUTH_JSON: ${{ secrets.FANTASY_AUTH_JSON }}
        run: |
          if [ -z "$FANTASY_AUTH_JSON" ]; then
            echo "Error: FANTASY_AUTH_JSON no esta definido en Secrets."
            exit 1
          fi
          echo "$FANTASY_AUTH_JSON" > tokens.json
          python -c "import json; json.load(open('tokens.json'))" || (echo "Error: Invalid JSON in FANTASY_AUTH_JSON secret"; exit 1)

      - name: Advanced Trading & Financial League Report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FANTASYBOT_LEAGUE: "017817326"
        run: |
          pip install requests
          python3 -c "
          from fantasybot.api import FantasyClient
          from fantasybot.strategy.historia import analyze_league_trading_history
          import os, requests

          try:
              c = FantasyClient()
              lid, tid = c.default_ids()

              league_history = analyze_league_trading_history(c, lid)
              managers_stats = league_history.get('managers', [])

              print('Tracked events:', league_history.get('tracked_events'))
              print('Tracked from:', league_history.get('tracked_from'), 'to', league_history.get('tracked_to'))

              report = '🏆 *INFORME DE TRADING Y GESTIÓN DE LA LIGA* 🏆\n\n'
              report += '📊 *Rendimiento Financiero y P&L por Mánager:*\n\n'

              for idx, m in enumerate(managers_stats, 1):
                  name = m.get('manager_name', 'Desconocido')
                  pos = m.get('position', '-')
                  pts = m.get('points', 0)
                  val = m.get('team_value', 0)
                  realized = m.get('realized_profit', 0)
                  unrealized = m.get('unrealized_profit', 0)
                  total_pnl = m.get('total_pnl', 0)
                  win_rate = m.get('win_rate_pct', 0)
                  revenue = m.get('total_sales_revenue', 0)
                  spent = m.get('total_purchases_spent', 0)

                  report += f'{idx}. *{name}* (Pos: {pos} | Pts: {pts})\n'
                  report += f'   • Plantilla: {val:,.0f} €\n'.replace(',', '.')
                  report += f'   • Ingresos Ventas: {revenue:,.0f} € | Gastos Compras: {spent:,.0f} €\n'.replace(',', '.')
                  report += f'   • Beneficio Realizado (Flips): {realized:+,.0f} €\n'.replace(',', '.')
                  report += f'   • Beneficio No Realizado (Plantilla): {unrealized:+,.0f} €\n'.replace(',', '.')
                  report += f'   • *P&L Total:* {total_pnl:+,.0f} € (Win Rate: {win_rate:.1f}%)\n\n'.replace(',', '.')

              print(report)

              token = os.getenv('TELEGRAM_TOKEN')
              chat_id = os.getenv('TELEGRAM_CHAT_ID')
              if token and chat_id:
                  url = f'https://api.telegram.org/bot{token}/sendMessage'
                  payload = {'chat_id': chat_id, 'text': report, 'parse_mode': 'Markdown'}
                  requests.post(url, json=payload)
          except Exception as e:
              print('Aviso en el reporte avanzado de historia:', e)
          "

      - name: Run Bot Agent & Execute
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FANTASYBOT_LEAGUE: "017817326"
        run: python -m fantasybot agent --execute

  # ============================================================
  # LIGA 2: CUEVA + 27 (018199965) - sin reportes a Telegram,
  # solo actua (alineacion, pujas, ventas), igual que la liga 1.
  # Job independiente y aislado: no comparte estado con liga 1.
  # ============================================================
  run-bot-liga2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install .

      - name: Create tokens.json from Secret
        env:
          FANTASY_AUTH_JSON: ${{ secrets.FANTASY_AUTH_JSON }}
        run: |
          if [ -z "$FANTASY_AUTH_JSON" ]; then
            echo "Error: FANTASY_AUTH_JSON no esta definido en Secrets."
            exit 1
          fi
          echo "$FANTASY_AUTH_JSON" > tokens.json
          python -c "import json; json.load(open('tokens.json'))" || (echo "Error: Invalid JSON in FANTASY_AUTH_JSON secret"; exit 1)

      - name: DEBUG - investigate sell error for liga 2
        env:
          FANTASYBOT_LEAGUE: "018199965"
        run: |
          python3 -c "
          from fantasybot.api import FantasyClient
          import json
          c = FantasyClient()
          lid, tid = c.default_ids()
          team = c.team(lid, tid)

          targets = ['E. Milit', 'Iago Aspas', 'Adama']
          print('=== JUGADORES EN TU EQUIPO (buscando los 3 recomendados) ===')
          found_ids = []
          for p in team['players']:
              pm = p['playerMaster']
              nick = pm.get('nickname') or pm.get('name') or ''
              if any(t in nick for t in targets):
                  print('Nombre:', nick)
                  print('  playerMaster id:', pm.get('id'))
                  print('  playerTeamId:', p.get('playerTeamId'))
                  print('  playerStatus:', pm.get('playerStatus'))
                  print('  raw player entry:', json.dumps(p, ensure_ascii=False)[:500])
                  found_ids.append(pm.get('id'))
                  print()

          print('=== BUSCANDO ESOS JUGADORES EN EL MERCADO (para ver si ya estan listados) ===')
          market = c.market(lid)
          for el in market:
              pm = el.get('playerMaster') or {}
              if pm.get('id') in found_ids:
                  print('ENCONTRADO en mercado:', pm.get('nickname'), '| discr:', el.get('discr'), '| id listado:', el.get('id'))
          print('(si no aparece nada arriba, NO estan listados en el mercado)')

          print()
          print('=== INTENTO DIRECTO DE VENTA CON RESPUESTA COMPLETA DEL ERROR ===')
          if found_ids:
              try:
                  resp = c.sell_player(lid, found_ids[0], 1000000)
                  print('EXITO:', resp)
              except Exception as e:
                  print('ERROR COMPLETO:', repr(e))
          "

      - name: Run Bot Agent & Execute (sin Telegram)
        env:
          FANTASYBOT_LEAGUE: "018199965"
        run: python -m fantasybot agent --execute
