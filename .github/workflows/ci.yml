 name: Run Fantasy Bot

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install package
        run: pip install .

      - name: Create tokens.json from Secret
        env:
          FANTASY_AUTH_JSON: ${{ secrets.FANTASY_AUTH_JSON }}
        run: |
          if [ -z "$FANTASY_AUTH_JSON" ]; then
            echo "Error: FANTASY_AUTH_JSON no esta definido en Secrets."
            exit 1
          fi
          echo "$FANTASY_AUTH_JSON" > tokens.json
          python -c "import json; json.load(open('tokens.json'))" || (echo "Error: Invalid JSON in FANTASY_AUTH_JSON secret"; exit 1)

      - name: DEBUG - inspect leagues/teams endpoint structure
        run: |
          python3 -c "
          from fantasybot.api import FantasyClient
          import json
          c = FantasyClient()
          lid, tid = c.default_ids()
          r = c.get(c._cmp(f'/leagues/{lid}/teams?x-lang=es'))
          print('TIPO:', type(r).__name__)
          if isinstance(r, list):
              print('NUMERO DE EQUIPOS:', len(r))
              print()
              print('=== CLAVES DEL PRIMER EQUIPO ===')
              print(list(r[0].keys()))
              print()
              print('=== PRIMER EQUIPO SIN EL ARRAY DE PLAYERS (para no saturar) ===')
              t0 = dict(r[0])
              t0.pop('players', None)
              print(json.dumps(t0, indent=2, ensure_ascii=False))
          else:
              print('CLAVES:', list(r.keys()) if isinstance(r, dict) else r)
              print(json.dumps(r, indent=2, ensure_ascii=False)[:2000])
          "

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fantasybot agent --execute
