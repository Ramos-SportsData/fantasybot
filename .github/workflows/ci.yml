name: Run Fantasy Bot

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install package
        run: pip install .

      - name: Create tokens.json from Secret
        env:
          FANTASY_AUTH_JSON: ${{ secrets.FANTASY_AUTH_JSON }}
        run: |
          if [ -z "$FANTASY_AUTH_JSON" ]; then
            echo "Error: FANTASY_AUTH_JSON no esta definido en Secrets."
            exit 1
          fi
          echo "$FANTASY_AUTH_JSON" > tokens.json
          python -c "import json; json.load(open('tokens.json'))" || (echo "Error: Invalid JSON in FANTASY_AUTH_JSON secret"; exit 1)

      - name: DEBUG - probe activity history endpoints
        run: |
          python3 -c "
          from fantasybot.api import FantasyClient
          import json
          c = FantasyClient()
          lid, tid = c.default_ids()
          candidates = [
              f'/leagues/{lid}/activities?x-lang=es',
              f'/leagues/{lid}/activity?x-lang=es',
              f'/leagues/{lid}/history?x-lang=es',
              f'/leagues/{lid}/transfers?x-lang=es',
              f'/leagues/{lid}/marketactivities?x-lang=es',
              f'/leagues/{lid}/teams/{tid}/activities?x-lang=es',
              f'/leagues/{lid}/teams/{tid}/activity?x-lang=es',
              f'/teams/{tid}/activities?x-lang=es',
              f'/teams/{tid}/activity?x-lang=es',
              f'/leagues/{lid}/activityfeed?x-lang=es',
              f'/leagues/{lid}/feed?x-lang=es',
          ]
          for path in candidates:
              print('---', path, '---')
              try:
                  r = c.get(c._cmp(path))
                  s = json.dumps(r, ensure_ascii=False)
                  print('OK. Tipo:', type(r).__name__, '| Longitud:', len(r) if hasattr(r, '__len__') else '?')
                  print(s[:600], '...' if len(s) > 600 else '')
              except Exception as e:
                  print('ERROR:', e)
              print()
          "

      - name: Run Bot Agent & Execute
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fantasybot agent --execute
