name: Run Fantasy Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install package
        run: pip install .

      - name: Create tokens.json from Secret
        env:
          FANTASY_AUTH_JSON: ${{ secrets.FANTASY_AUTH_JSON }}
        run: |
          if [ -z "$FANTASY_AUTH_JSON" ]; then
            echo "Error: FANTASY_AUTH_JSON no esta definido en Secrets."
            exit 1
          fi
          echo "$FANTASY_AUTH_JSON" > tokens.json
          python -c "import json; json.load(open('tokens.json'))" || (echo "Error: Invalid JSON in FANTASY_AUTH_JSON secret"; exit 1)

      - name: DEBUG - dump market entry
        run: |
          python3 -c "
          from fantasybot.api import FantasyClient
          c = FantasyClient()
          lid, tid = c.default_ids()
          market = c.market(lid)
          import json
          for el in market:
              pm = el.get('playerMaster', {})
              if 'girrezabala' in (pm.get('nickname') or '').lower():
                  print(json.dumps(el, indent=2, ensure_ascii=False))
          "

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fantasybot agent --execute
