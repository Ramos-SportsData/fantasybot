name: Run Fantasy Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install package
        run: pip install .

      - name: Create tokens.json from Secret
        env:
          FANTASY_AUTH_JSON: ${{ secrets.FANTASY_AUTH_JSON }}
        run: |
          if [ -z "$FANTASY_AUTH_JSON" ]; then
            echo "Error: FANTASY_AUTH_JSON no esta definido en Secrets."
            exit 1
          fi
          echo "$FANTASY_AUTH_JSON" > tokens.json
          python -c "import json; json.load(open('tokens.json'))" || (echo "Error: Invalid JSON in FANTASY_AUTH_JSON secret"; exit 1)

      - name: DEBUG - dump own market listings (offers)
        run: |
          python3 -c "
          from fantasybot.api import FantasyClient
          import json
          c = FantasyClient()
          lid, tid = c.default_ids()
          team = c.team(lid, tid)
          own_ids = {p['playerMaster']['id'] for p in team['players']}
          market = c.market(lid)
          print('=== TOTAL LISTINGS EN MERCADO:', len(market), '===')
          found = False
          for el in market:
              pm = el.get('playerMaster') or {}
              if pm.get('id') in own_ids:
                  found = True
                  print()
                  print('=== LISTADO PROPIO ENCONTRADO ===')
                  print(json.dumps(el, indent=2, ensure_ascii=False))
          if not found:
              print()
              print('No se encontro ningun listado propio en client.market(). Puede que las ventas propias no aparezcan en este endpoint.')
              print('IDs propios:', own_ids)
          "

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fantasybot agent --execute
