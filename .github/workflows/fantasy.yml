      - name: Restore tokens.json from secret
        run: |
          echo "${{ secrets.FANTASY_TOKENS_JSON }}" > tokens.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run FantasyBot Agent
        run: |
          python -m fantasybot agent --execute

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push state changes
        run: |
          # Check if there are changes in our state directory
          if ! git diff --quiet .state_cueva_plus_27/; then
            echo "State changes detected for CUEVA + 27, committing..."
            git add .state_cueva_plus_27/
            git commit -m "Update CUEVA + 27 state [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No state changes to commit for CUEVA + 27"
