name: LaLiga Fantasy Automation

on:
  schedule:
    # Runs at 09:00, 17:00, and 18:00 Spanish time
    # Approximate UTC times (will be ~1 hour off in winter due to DST)
    - cron: '0 7,15,16 * * *'
  workflow_dispatch:

jobs:
  fantasybot-hugo:
    runs-on: ubuntu-latest
    env:
      FANTASY_LEAGUE_ID: 017817326
      FANTASY_STATE_DIR: .state_hugo_league_1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore tokens.json from secret
        run: |
          # Create a temporary Python script to handle the token restoration
          cat > restore_tokens.py << 'EOF'
import json
import os
import sys

# Get the token secret from environment
token_secret = os.environ.get('FANTASY_TOKENS_JSON')
if not token_secret:
    print("Error: FANTASY_TOKENS_JSON secret is not set")
    sys.exit(1)

# Try to parse the JSON
try:
    # Remove any potential BOM and whitespace
    if token_secret.startswith('﻿'):
        token_secret = token_secret[1:]
    token_secret = token_secret.strip()

    # Parse JSON
    tokens = json.loads(token_secret)

    # Write to tokens.json
    with open('tokens.json', 'w', encoding='utf-8') as f:
        json.dump(tokens, f, separators=(',', ':'))

    print("✓ tokens.json restored successfully")
except json.JSONDecodeError as e:
    print(f"✗ Invalid JSON in FANTASY_TOKENS_JSON secret: {e}")
    # Show first 50 characters for debugging
    preview = repr(token_secret[:50]) if len(token_secret) > 50 else repr(token_secret)
    print(f"First 50 chars: {preview}")
    sys.exit(1)
except Exception as e:
    print(f"✗ Error processing tokens: {e}")
    sys.exit(1)
EOF

          # Set the secret as environment variable for the Python script
          export FANTASY_TOKENS_JSON="${{ secrets.FANTASY_TOKENS_JSON }}"
          python3 restore_tokens.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run FantasyBot Agent
        run: |
          python -m fantasybot agent --execute

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push state changes
        run: |
          if git diff --quiet .state_hugo_league_1/; then
            echo "No state changes to commit for HUGO LEAGUE 1"
          else
            git add .state_hugo_league_1/
            git commit -m "Update HUGO LEAGUE 1 state [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:${{ github.ref }}
          fi

  fantasybot-cueva:
