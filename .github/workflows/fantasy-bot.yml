name: LaLiga Fantasy Automation

on:
  schedule:
    # Runs at 09:00, 17:00, and 18:00 Spanish time
    # Approximate UTC times (will be ~1 hour off in winter due to DST)
    - cron: '0 8,15,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantasybot-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fantasybot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1        # avoids a push race condition between the two leagues
      matrix:
        include:
          - name: "HUGO LEAGUE 1"
            league_id: "017817326"
            state_dir: ".state_hugo_league_1"
          - name: "CUEVA + 27"
            league_id: "018199965"
            state_dir: ".state_cueva_plus_27"
    env:
      FANTASY_LEAGUE_ID: ${{ matrix.league_id }}
      FANTASY_LEAGUE_NAME: ${{ matrix.name }}
      FANTASY_STATE_DIR: ${{ matrix.state_dir }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore tokens.json from secret
        env:
          FANTASY_TOKENS_JSON: ${{ secrets.FANTASY_TOKENS_JSON }}
        run: |
          python3 -c "import json,os;json.dump(json.loads(os.environ['FANTASY_TOKENS_JSON']),open('tokens.json','w'),separators=(',',':'))"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run FantasyBot Agent
        id: run_bot
        run: |
          python -m fantasybot agent --execute --execute-sells --execute-clauses

      - name: Notify Telegram on failure
        if: failure() && steps.run_bot.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ FantasyBot falló en ${{ matrix.name }} (${{ github.run_id }})"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push state changes
        run: |
          git pull --rebase origin ${{ github.ref_name }} || true
          if git diff --quiet ${FANTASY_STATE_DIR}/; then
            echo "No state changes to commit for ${{ matrix.name }}"
          else
            git add ${FANTASY_STATE_DIR}/
            git commit -m "Update ${{ matrix.name }} state [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:${{ github.ref }}
          fi
